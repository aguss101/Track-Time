name: track_time
description: "App personal de tracking de tiempo de estudio/trabajo"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  http: ^1.2.2
  flutter_svg: ^2.0.10+1     # logo vectorial
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true

  assets:
    - assets/imagenes/

flutter_native_splash:
  color: "#1E1E21"
  android_12:
    color: "#1E1E21"
  android: true
  ios: false
  web: false
